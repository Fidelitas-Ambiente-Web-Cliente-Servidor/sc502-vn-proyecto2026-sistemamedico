<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda - MediControl</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="./agenda_styles.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm px-4">
    <div class="container-fluid">
      <div class="d-flex align-items-center">
        <i class="bi bi-heart-pulse-fill text-primary fs-4 me-2"></i>
        <span class="fw-bold text-primary fs-5">MediControl</span>
      </div>
      <div class="mx-auto">
        <ul class="navbar-nav flex-row gap-4">
          <li class="nav-item">
            <a class="nav-link text-primary" href="../Dashboard/dashboard.php">Dashboard</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active fw-bold text-primary" href="#">Agenda</a>
          </li>
        </ul>
      </div>
      <div class="d-flex gap-2">
        <a href="../UserProfile/UserProfile.php" class="btn btn-primary btn-sm">Perfil</a>
        <a class="nav-link text-primary" href="../LoginRegistro/logout.php">Salir</a>
      </div>
    </div>
  </nav>

  <div class="container-fluid mt-4 px-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3 class="text-primary"><i class="bi bi-calendar2-week me-2"></i>Agenda de Citas</h3>
      <button class="btn btn-primary" onclick="abrirModalNueva()">
        <i class="bi bi-plus-circle me-1"></i> Nueva Cita
      </button>
    </div>

    <div class="card shadow-sm">
      <div class="card-body p-0">
        <table class="table table-hover mb-0" id="tablaCitas">
          <thead class="table-primary">
            <tr>
              <th>Paciente</th>
              <th>Doctor</th>
              <th>Fecha</th>
              <th>Hora</th>
              <th>Motivo</th>
              <th class="text-center">Acciones</th>
            </tr>
          </thead>
          <tbody id="cuerpoTabla"></tbody>
        </table>
      </div>
    </div>

    <div id="mensajeVacio" class="text-center mt-5" style="display:none;">
      <i class="bi bi-calendar-x text-secondary" style="font-size:60px;"></i>
      <p class="text-secondary mt-2">No hay citas registradas. ¡Agrega una nueva!</p>
    </div>
  </div>

  <!-- Modal Agregar / Editar Cita -->
  <div class="modal fade" id="modalCita" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">

        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title" id="tituloModal">
            <i class="bi bi-calendar-plus me-2"></i>Nueva Cita
          </h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">
          <form id="formularioCita" novalidate>

            <input type="hidden" id="citaId">

            <!-- Doctor preseleccionado (desde dashboard) -->
            <div class="mb-3" id="doctorPreseleccionadoDiv" style="display:none;">
              <label class="form-label">Doctor</label>
              <div class="form-control bg-light" id="doctorPreseleccionado"></div>
            </div>

            <!-- Selector de doctor (cuando se abre desde agenda) -->
            <div class="mb-3" id="campoDoctorDiv">
              <label class="form-label">Doctor <span class="text-danger">*</span></label>
              <select class="form-select" id="campoDoctor" onchange="aplicarRestriccionHora(this.value)">
                <option value="">Seleccione un doctor</option>
              </select>
              <span class="error-msg" id="errDoctor">Seleccione un doctor*</span>
            </div>

            <div class="mb-3">
              <label class="form-label">Fecha</label>
              <input type="date" class="form-control" id="campoFecha">
              <span class="error-msg" id="errFecha" style="display:none;">Campo obligatorio*</span>
            </div>

            <div class="mb-3">
              <label class="form-label">Hora</label>
              <input type="time" class="form-control" id="campoHora">
              <span class="error-msg" id="errHora" style="display:none;">Campo obligatorio*</span>
              <small class="text-muted" id="horarioInfo"></small>
            </div>

            <div class="mb-3">
              <label class="form-label">Motivo de la cita</label>
              <textarea class="form-control" id="campoMotivo" rows="3" placeholder="Descripción o motivo de la cita"></textarea>
            </div>

          </form>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary" onclick="guardarCita()">
            <i class="bi bi-save me-1"></i> Guardar
          </button>
        </div>

      </div>
    </div>
  </div>

  <!-- Modal Confirmar Eliminación -->
  <div class="modal fade" id="modalEliminar" tabindex="-1">
    <div class="modal-dialog modal-sm">
      <div class="modal-content">
        <div class="modal-header bg-danger text-white">
          <h5 class="modal-title"><i class="bi bi-trash me-2"></i>Eliminar Cita</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body text-center">
          <p>¿Estás seguro de que deseas eliminar esta cita?</p>
          <input type="hidden" id="idEliminar">
        </div>
        <div class="modal-footer justify-content-center">
          <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-danger btn-sm" onclick="confirmarEliminar()">
            <i class="bi bi-trash me-1"></i> Eliminar
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./agenda_scripts.js"></script>
</body>
</html>
